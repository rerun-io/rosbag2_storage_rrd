version: 2

# Proposes each new Rerun release as one PR, so CI (Rust and the ROS 2 build) shows whether
# it breaks the plugin. Only the Rerun crates: they are the dependency that moves fastest
# and the one this plugin is most coupled to.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies"]
    allow:
      - dependency-name: rerun
      - dependency-name: "re_*"
    ignore:
      # Not part of the Rerun workspace; versioned on its own.
      - dependency-name: re_cdr
    groups:
      # The Rerun crates only build against each other at the same version.
      rerun:
        patterns: ["rerun", "re_*"]
